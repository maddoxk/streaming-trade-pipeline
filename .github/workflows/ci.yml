name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
          POSTGRES_DB: pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PG_DSN: postgresql://pipeline:pipeline@localhost:5432/pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,spark]"
      - run: pytest -v

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, unit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Build Spark image
        run: docker compose build spark

      # Scenario 1: replay as fast as possible (saturation), with 5 s of injected disorder.
      - name: E2E burst replay
        run: |
          docker compose up -d
          python scripts/e2e.py --speedup 0 --max-disorder-ms 5000 --label burst \
            --results results/ci_burst.json
          python -m pipeline.report --dsn postgresql://pipeline:pipeline@localhost:5432/pipeline
      - name: Spark logs (burst)
        if: always()
        run: docker compose logs spark | tail -n 80
      - run: docker compose down -v

      # Scenario 2: paced replay at 30x real time (not saturated), same correctness checks.
      - name: E2E paced replay (30x)
        run: |
          docker compose up -d
          python scripts/e2e.py --speedup 30 --max-disorder-ms 5000 --label paced_30x \
            --results results/ci_paced_30x.json
      - name: Spark logs (paced)
        if: always()
        run: docker compose logs spark | tail -n 80
      - run: docker compose down -v
        if: always()

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: results/
